services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rgv
      POSTGRES_USER: rgv
      POSTGRES_PASSWORD: rgv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.0
    command: mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts '*'
    ports:
      - "5000:5000"

volumes:
  postgres_data:
  qdrant_storage:
